name: LightningSword
version: '1.0.0'
main: com.lightningsword.LightningSwordPlugin
api-version: '1.20'
commands:
  lightningsword:
    description: Gives you the Lightning Sword
    usage: /lightningsword
    aliases: [lsword]
  icesword:
    description: Gives you the Ice Sword
    usage: /icesword
    aliases: [isword]
  bloodsword:
    description: Gives you the Blood Sword
    usage: /bloodsword
    aliases: [bsword]
  wardensword:
    description: Gives you the Warden Sword
    usage: /wardensword
    aliases: [wsword]
